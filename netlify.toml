[build]
  command = "npm run build"
  publish = "build"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/ethscribe"
  to = "/expeditions"
  status = 301
  force = true

[[redirects]]
  from = "/api/market/status"
  to = "/.netlify/functions/market-status"
  status = 200
  force = true

[[redirects]]
  from = "/api/market/wallet"
  to = "/.netlify/functions/market-wallet"
  status = 200
  force = true

[[redirects]]
  from = "/api/ethscriptions/exists/:sha"
  to = "https://api.ethscriptions.com/v2/ethscriptions/exists/:sha"
  status = 200
  force = true

[[redirects]]
  from = "/api/ethscriptions/media/:id"
  to = "/.netlify/functions/ethscription-media?id=:id"
  status = 200
  force = true

[[redirects]]
  from = "/api/ethscriptions/:id"
  to = "https://api.ethscriptions.com/v2/ethscriptions/:id"
  status = 200
  force = true

[[redirects]]
  from = "/api/findings"
  to = "/.netlify/functions/findings"
  status = 200
  force = true

[[redirects]]
  from = "/api/proposals"
  to = "/.netlify/functions/proposals"
  status = 200
  force = true

[[redirects]]
  from = "/api/targets/check"
  to = "/.netlify/functions/target-check"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
